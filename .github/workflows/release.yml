name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate tag matches library.json version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os

          tag_name = os.environ["TAG_NAME"]
          with open("lib/AssistentLibrary/library.json", "r", encoding="utf-8") as fp:
              version = json.load(fp)["version"]

          expected_tag = f"v{version}"
          if tag_name != expected_tag:
              raise SystemExit(
                  f"Tag {tag_name} does not match library.json version. Expected {expected_tag}"
              )

          print(f"Release tag validated: {tag_name}")
          PY

      - name: Ensure tag points to main history
        run: |
          git fetch origin main
          if ! git branch -r --contains "$GITHUB_SHA" | grep -q "origin/main"; then
            echo "Release tags must point to a commit that is reachable from origin/main"
            exit 1
          fi

      - name: Create source archive
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git archive --format zip --output "AssistentLibrary-${TAG_NAME}.zip" "$GITHUB_SHA"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: AssistentLibrary-${{ github.ref_name }}.zip
